             C 59 52, 60 52, 60 53
             C 60 54, 59 55, 57 55
             C 55 56, 54 57, 53 58
             C 51 61, 50 64, 49 68
             C 49 71, 51 72, 53 72
             L 57 72
             C 58 72, 58 71, 57 69
             C 56 66, 55 62, 55 59
             C 51 59, 48 62, 46 66
             C 45 68, 44 71, 45 72
